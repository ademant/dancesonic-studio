[package]
name = "dancesonic-studio"
description = "DanceSonic Studio: desktop library tool and player for dance music"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gstreamer = { version = "0.25.4", default-features = false }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
oo7 = { version = "0.7.1", default-features = false, features = ["tokio", "native_crypto"] }
secrecy = "0.10.3"
studio-core = { path = "../core" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros"] }
