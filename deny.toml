# cargo-deny: licenses, advisories, bans and sources. See AGENTS.md.

[graph]
all-features = true

[advisories]
# Every advisory fails the check; an exception needs an entry here with a reason.
ignore = [
    # paste: archived by its author as finished, no known vulnerability. It is a
    # proc-macro used at compile time by lofty (tags of local files, #10) and adds
    # no code that runs in Studio. Remove once lofty drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro of lofty; no vulnerability" },
]

[licenses]
# Licenses compatible with AGPL-3.0-or-later.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla root certificate data, bundled by reqwest's TLS verifier. A permissive
    # data license, compatible with AGPL-3.0; see the commit that added reqwest.
    "CDLA-Permissive-2.0",
    # Public-domain dedication (notify, folder watching for #10); places no
    # conditions on the combined work, so it is compatible with AGPL-3.0.
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list covers licenses expected later; do not warn while unused.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
