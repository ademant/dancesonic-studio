# cargo-deny: licenses, advisories, bans and sources. See AGENTS.md.

[graph]
all-features = true

[advisories]
# Every advisory fails the check; an exception needs an entry here with a reason.
ignore = []

[licenses]
# Licenses compatible with AGPL-3.0-or-later.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list covers licenses expected later; do not warn while unused.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
